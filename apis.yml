aid: wisk-aero
name: Wisk Aero
description: >-
  Wisk Aero is an autonomous, all-electric eVTOL air taxi developer and a
  wholly-owned subsidiary of The Boeing Company. Wisk is developing its Generation 6
  aircraft, a four-passenger self-flying eVTOL designed to operate under human
  supervisor oversight from a multi-vehicle supervision center, pursuing
  certification under three FAA programs: Type Certification, Production
  Certification, and Operation Certification. Wisk evolved from earlier Kitty
  Hawk programs and has logged over 1,750 autonomous test flights across five
  aircraft generations since 2010. Announced launch communities include
  Houston, Texas and Brisbane, Australia (in support of the 2032 Olympic and
  Paralympic Games). In March 2026 Wisk was selected by the White House to help
  lead the safe U.S. introduction of autonomous air taxi flight. Wisk is
  hardware- and operations-focused, with no public consumer or developer APIs.
